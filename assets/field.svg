<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 200" width="896" height="200" role="img" aria-label="runtime field">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="40%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ccff00" stop-opacity="0"/>
      <stop offset="12%" stop-color="#ccff00" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#e8ff6a" stop-opacity="0.95"/>
      <stop offset="88%" stop-color="#ccff00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ccff00" stop-opacity="0"/>
    </linearGradient>
    <filter id="filaments" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0018 0.11" numOctaves="2" seed="4" result="n">
        <animate attributeName="baseFrequency" values="0.0018 0.11;0.0024 0.16;0.0018 0.11" dur="16s" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix in="n" type="matrix" values="
        0 0 0 0 0.80
        0 0 0 0 1.00
        0 0 0 0 0.00
        0 0 0 0.85 -0.35" result="tint"/>
      <feComponentTransfer in="tint" result="crush">
        <feFuncA type="linear" slope="1.6" intercept="-0.25"/>
      </feComponentTransfer>
    </filter>
    <pattern id="scan" width="896" height="4" patternUnits="userSpaceOnUse">
      <rect width="896" height="1" fill="#000" fill-opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="896" height="200" fill="#050605"/>
  <rect width="896" height="200" filter="url(#filaments)"/>
  <rect width="896" height="200" fill="url(#scan)"/>
  <rect width="896" height="200" fill="url(#vignette)"/>
  <rect x="0" y="198" width="896" height="2" fill="url(#fade)"/>
  <rect x="40" y="198" width="8" height="2" fill="#ccff00">
    <animate attributeName="opacity" values="1;0.12;1" dur="1.15s" repeatCount="indefinite"/>
  </rect>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="720" viewBox="0 0 880 360" role="img" aria-label="braintied runtime">
  <rect width="880" height="360" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="879" height="359" rx="14" fill="none" stroke="#30363d"/>
  <rect width="880" height="40" rx="14" fill="#161b22"/>
  <rect y="26" width="880" height="14" fill="#161b22"/>
  <circle cx="22" cy="20" r="5" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="5" fill="#febc2e"/>
  <circle cx="58" cy="20" r="5" fill="#28c840"/>
  <text x="80" y="24" fill="#8b949e" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="12">ga1ien@braintied</text>

  <text x="28" y="72" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">
    <tspan fill="#8b949e">$</tspan><tspan dx="8" fill="#c9d1d9">whoami</tspan>
  </text>
  <text x="52" y="96" fill="#ccff00" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">got tired of waiting on other people</text>

  <text x="28" y="136" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">
    <tspan fill="#8b949e">$</tspan><tspan dx="8" fill="#c9d1d9">ps</tspan>
  </text>
  <text x="52" y="160" fill="#8b949e" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">ora</text>
  <text x="200" y="160" fill="#c9d1d9" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">agent operating system</text>
  <text x="52" y="182" fill="#8b949e" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">watchtower</text>
  <text x="200" y="182" fill="#c9d1d9" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">every session, searchable</text>
  <text x="52" y="204" fill="#8b949e" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">sentigen</text>
  <text x="200" y="204" fill="#c9d1d9" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">system of record</text>
  <text x="52" y="226" fill="#8b949e" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">kit</text>
  <text x="200" y="226" fill="#c9d1d9" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">one companion, n brains</text>
  <text x="52" y="248" fill="#8b949e" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">kulti</text>
  <text x="200" y="248" fill="#c9d1d9" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">they watch it ship</text>

  <text x="28" y="288" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">
    <tspan fill="#8b949e">$</tspan><tspan dx="8" fill="#c9d1d9">uptime</tspan>
  </text>
  <text x="52" y="312" fill="#8b949e" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">apr 2025</text>
  <text x="200" y="312" fill="#c9d1d9" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">first line</text>
  <text x="52" y="334" fill="#8b949e" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">now</text>
  <text x="200" y="334" fill="#ccff00" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="15">people talk. agents ship.</text>
</svg>

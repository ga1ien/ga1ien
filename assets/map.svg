<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="520" viewBox="0 0 880 260" role="img" aria-label="how the factory is wired">
  <rect width="880" height="260" rx="12" fill="#000000"/>
  <rect x="0.6" y="0.6" width="878.8" height="258.8" rx="12" fill="none" stroke="#222"/>
  <rect width="3" height="260" rx="2" fill="#ccff00"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#ccff00"/>
    </marker>
  </defs>

  <!-- nodes: x,y,w,h -->
  <!-- talk -->
  <rect x="28" y="40" width="100" height="52" rx="6" fill="#0a0a0a" stroke="#333"/>
  <text x="78" y="62" text-anchor="middle" fill="#ccff00" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="13">talk</text>
  <text x="78" y="80" text-anchor="middle" fill="#666" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="10">people</text>

  <!-- sentigen -->
  <rect x="168" y="32" width="148" height="68" rx="6" fill="#0a0a0a" stroke="#333"/>
  <text x="242" y="58" text-anchor="middle" fill="#e8e8e8" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="13">sentigen</text>
  <text x="242" y="76" text-anchor="middle" fill="#666" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="10">meetings mail crm</text>

  <!-- ora -->
  <rect x="356" y="32" width="148" height="68" rx="6" fill="#0a0a0a" stroke="#ccff00" stroke-opacity="0.55"/>
  <text x="430" y="58" text-anchor="middle" fill="#ccff00" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="13">ora</text>
  <text x="430" y="76" text-anchor="middle" fill="#666" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="10">agent os · cortex</text>

  <!-- kit -->
  <rect x="544" y="18" width="132" height="44" rx="6" fill="#0a0a0a" stroke="#333"/>
  <text x="610" y="36" text-anchor="middle" fill="#e8e8e8" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="13">kit</text>
  <text x="610" y="52" text-anchor="middle" fill="#666" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="10">one companion</text>

  <!-- kulti -->
  <rect x="544" y="72" width="132" height="44" rx="6" fill="#0a0a0a" stroke="#333"/>
  <text x="610" y="90" text-anchor="middle" fill="#e8e8e8" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="13">kulti</text>
  <text x="610" y="106" text-anchor="middle" fill="#666" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="10">live stage</text>

  <!-- watchtower -->
  <rect x="356" y="160" width="148" height="68" rx="6" fill="#0a0a0a" stroke="#333"/>
  <text x="430" y="186" text-anchor="middle" fill="#e8e8e8" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="13">watchtower</text>
  <text x="430" y="204" text-anchor="middle" fill="#666" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="10">every session kept</text>

  <!-- ship -->
  <rect x="712" y="40" width="140" height="52" rx="6" fill="#0a0a0a" stroke="#333"/>
  <text x="782" y="62" text-anchor="middle" fill="#ccff00" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="13">ship</text>
  <text x="782" y="80" text-anchor="middle" fill="#666" font-family="Menlo, Monaco, ui-monospace, monospace" font-size="10">in public</text>

  <!-- arrows -->
  <line x1="128" y1="66" x2="166" y2="66" stroke="#ccff00" stroke-width="1.25" marker-end="url(#arr)"/>
  <line x1="316" y1="66" x2="354" y2="66" stroke="#ccff00" stroke-width="1.25" marker-end="url(#arr)"/>
  <line x1="504" y1="50" x2="542" y2="40" stroke="#555" stroke-width="1.15" marker-end="url(#arr)"/>
  <line x1="504" y1="82" x2="542" y2="94" stroke="#555" stroke-width="1.15" marker-end="url(#arr)"/>
  <line x1="676" y1="66" x2="710" y2="66" stroke="#ccff00" stroke-width="1.25" marker-end="url(#arr)"/>
  <line x1="430" y1="100" x2="430" y2="158" stroke="#555" stroke-width="1.15" marker-end="url(#arr)"/>
</svg>
